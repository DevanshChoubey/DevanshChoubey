<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Career: TCS data scientist 2018 to 2021; Kavida 2021 to 2025, from data scientist to senior data scientist to Head of AI; QAD engineering manager and AI architect since November 2025 via the acquisition of Kavida.">
<title>Career: TCS data scientist 2018 to 2021; Kavida 2021 to 2025, from data scientist to senior data scientist to Head of AI; QAD engineering manager and AI architect since November 2025 via the acquisition of Kavida.</title>
<defs>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity="0.28"/></pattern>
  <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000500" stop-opacity="0.9"/><stop offset="0.25" stop-color="#000500" stop-opacity="0"/><stop offset="0.8" stop-color="#000500" stop-opacity="0"/><stop offset="1" stop-color="#000500" stop-opacity="0.95"/></linearGradient>
</defs>
<style>
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .g{fill:#00ff41}.g2{fill:#00b32c}.g3{fill:#0a5c1f}.w{fill:#d6ffe0}
  .bar{transform-box:fill-box;transform-origin:left center}
.grow{animation:grow 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}
.head{animation:head 1.6s ease-in-out infinite}@keyframes head{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.seq{opacity:1!important}.bar{transform:scaleX(1)!important}}
</style>
<rect x="0.5" y="0.5" width="879" height="279" rx="10" fill="#000500" stroke="#0a5c1f"/>
<text x="40" y="44" class="m w" font-size="14">$ git log --career --graph</text><text x="360" y="44" class="m g2" font-size="12" text-anchor="middle">2019</text><path d="M360.2 56 V256" stroke="#0a5c1f" stroke-opacity=".5" stroke-dasharray="2 4"/><text x="421" y="44" class="m g2" font-size="12" text-anchor="middle">2020</text><path d="M420.5 56 V256" stroke="#0a5c1f" stroke-opacity=".5" stroke-dasharray="2 4"/><text x="481" y="44" class="m g2" font-size="12" text-anchor="middle">2021</text><path d="M480.9 56 V256" stroke="#0a5c1f" stroke-opacity=".5" stroke-dasharray="2 4"/><text x="541" y="44" class="m g2" font-size="12" text-anchor="middle">2022</text><path d="M541.2 56 V256" stroke="#0a5c1f" stroke-opacity=".5" stroke-dasharray="2 4"/><text x="602" y="44" class="m g2" font-size="12" text-anchor="middle">2023</text><path d="M601.6 56 V256" stroke="#0a5c1f" stroke-opacity=".5" stroke-dasharray="2 4"/><text x="662" y="44" class="m g2" font-size="12" text-anchor="middle">2024</text><path d="M662.0 56 V256" stroke="#0a5c1f" stroke-opacity=".5" stroke-dasharray="2 4"/><text x="722" y="44" class="m g2" font-size="12" text-anchor="middle">2025</text><path d="M722.3 56 V256" stroke="#0a5c1f" stroke-opacity=".5" stroke-dasharray="2 4"/><text x="783" y="44" class="m g2" font-size="12" text-anchor="middle">2026</text><path d="M782.7 56 V256" stroke="#0a5c1f" stroke-opacity=".5" stroke-dasharray="2 4"/><text x="40" y="84" class="m w" font-size="14" font-weight="700">QAD</text><text x="40" y="100" class="m g2" font-size="12">Eng Manager &amp; AI Architect</text><rect class="bar grow" x="772.4" y="74" width="67.6" height="12" rx="6" fill="#00ff41" filter="url(#glow)"/><circle class="head" cx="840.0" cy="80" r="6" fill="#d6ffe0" filter="url(#glow)"/><text x="40" y="118" class="m w" font-size="14" font-weight="700">Kavida</text><text x="40" y="134" class="m g2" font-size="12">acquired by QAD</text><rect class="bar grow" x="506.2" y="108" width="266.2" height="12" rx="6" fill="none" stroke="#00b32c"/><text x="62" y="152" class="m g2" font-size="14" font-weight="400">Head of AI</text><rect class="bar grow" x="596.8" y="142" width="175.6" height="12" rx="6" fill="#0a5c1f" stroke="#00b32c"/><text x="62" y="182" class="m g2" font-size="14" font-weight="400">Senior Data Scientist</text><rect class="bar grow" x="536.4" y="172" width="60.4" height="12" rx="6" fill="#0a5c1f" stroke="#00b32c"/><text x="62" y="212" class="m g2" font-size="14" font-weight="400">Data Scientist</text><rect class="bar grow" x="506.2" y="202" width="30.2" height="12" rx="6" fill="#0a5c1f" stroke="#00b32c"/><text x="40" y="242" class="m w" font-size="14" font-weight="700">TCS</text><text x="40" y="258" class="m g2" font-size="12">Data Scientist</text><rect class="bar grow" x="340.3" y="232" width="166.0" height="12" rx="6" fill="none" stroke="#00b32c"/>
<rect x="1" y="1" width="878" height="278" rx="10" fill="url(#vig)"/><rect x="1" y="1" width="878" height="278" rx="10" fill="url(#scan)"/>
</svg>
