<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="35 engineers led across AI pods at QAD. 10+ enterprise clients running my agents. $10M+ revenue driven by AI agents. 18-person AI team built at Kavida.">
<title>35 engineers led across AI pods at QAD. 10+ enterprise clients running my agents. $10M+ revenue driven by AI agents. 18-person AI team built at Kavida.</title>
<defs>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity="0.28"/></pattern>
  <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000500" stop-opacity="0.9"/><stop offset="0.25" stop-color="#000500" stop-opacity="0"/><stop offset="0.8" stop-color="#000500" stop-opacity="0"/><stop offset="1" stop-color="#000500" stop-opacity="0.95"/></linearGradient>
</defs>
<style>
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .g{fill:#00ff41}.g2{fill:#00b32c}.g3{fill:#0a5c1f}.w{fill:#d6ffe0}
  .pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.75}}
.in0{animation:in0 8s ease-out infinite}@keyframes in0{0%,0%{opacity:0}10%,100%{opacity:1}}
.in1{animation:in1 8s ease-out infinite}@keyframes in1{0%,6%{opacity:0}16%,100%{opacity:1}}
.in2{animation:in2 8s ease-out infinite}@keyframes in2{0%,12%{opacity:0}22%,100%{opacity:1}}
.in3{animation:in3 8s ease-out infinite}@keyframes in3{0%,18%{opacity:0}28%,100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.seq{opacity:1!important}.bar{transform:scaleX(1)!important}}
</style>
<rect x="0.5" y="0.5" width="879" height="149" rx="10" fill="#000500" stroke="#0a5c1f"/>
<g class="in0"><rect x="20" y="20" width="198" height="110" rx="6" fill="#000500" stroke="#0a5c1f"/><text x="38" y="72" class="m g pulse" font-size="38" font-weight="700" filter="url(#glow)">35</text><text x="38" y="98" class="m g2" font-size="13">engineers led across</text><text x="38" y="116" class="m g2" font-size="13">AI pods at QAD</text></g><g class="in1"><rect x="234" y="20" width="198" height="110" rx="6" fill="#000500" stroke="#0a5c1f"/><text x="252" y="72" class="m g pulse" font-size="38" font-weight="700" filter="url(#glow)">10+</text><text x="252" y="98" class="m g2" font-size="13">enterprise clients</text><text x="252" y="116" class="m g2" font-size="13">running my agents</text></g><g class="in2"><rect x="448" y="20" width="198" height="110" rx="6" fill="#000500" stroke="#0a5c1f"/><text x="466" y="72" class="m g pulse" font-size="38" font-weight="700" filter="url(#glow)">$10M+</text><text x="466" y="98" class="m g2" font-size="13">revenue driven</text><text x="466" y="116" class="m g2" font-size="13">by AI agents</text></g><g class="in3"><rect x="662" y="20" width="198" height="110" rx="6" fill="#000500" stroke="#0a5c1f"/><text x="680" y="72" class="m g pulse" font-size="38" font-weight="700" filter="url(#glow)">18</text><text x="680" y="98" class="m g2" font-size="13">person AI team</text><text x="680" y="116" class="m g2" font-size="13">built at Kavida</text></g>
<rect x="1" y="1" width="878" height="148" rx="10" fill="url(#vig)"/><rect x="1" y="1" width="878" height="148" rx="10" fill="url(#scan)"/>
